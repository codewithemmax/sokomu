<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" role="img" aria-label="Dialect map of Nigeria">
  <title>Cultural Dialect Map of Nigeria</title>
  <!-- Nigeria national outline -->
  <path id="nigeria-outline" d="M88 148L142 86L238 64L348 56L458 68L554 92L584 166L542 258L496 346L424 416L324 468L244 462L186 408L102 388L78 312L88 148Z" fill="#EEEAE1" stroke="#121A3F" stroke-width="2" />
  <!-- River Niger and River Benue confluence -->
  <path id="rivers-niger-benue" d="M118 164C188 212 248 256 306 296M532 238C452 262 376 280 306 296M306 296C304 352 292 410 278 462" stroke="#0369A1" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.45" />
  <!-- Kano Hausa (Northern savannas) -->
  <path id="region-ha-kano" d="M278 82L388 82L408 162L302 172L262 126L278 82Z" fill="#FFFFFF" stroke="#121A3F" stroke-width="1.75" />
  <!-- Lagos Pidgin (Coastal Southwest lagoon) -->
  <path id="region-pcm-lagos" d="M84 352L134 350L138 388L92 390L84 352Z" fill="#FFFFFF" stroke="#121A3F" stroke-width="1.75" />
