  <path id="region-yo-ijebu" d="M136 336L188 332L194 378L140 382L136 336Z" fill="#FFFFFF" stroke="#121A3F" stroke-width="1.75" />
  <!-- Ondo Yoruba (Southeastern Yoruba forest) -->
  <path id="region-yo-ondo" d="M192 324L248 322L252 374L196 376L192 324Z" fill="#FFFFFF" stroke="#121A3F" stroke-width="1.75" />
  <!-- Ekiti Yoruba (Eastern Yoruba hills) -->
  <path id="region-yo-ekiti" d="M196 276L254 274L256 318L194 320L196 276Z" fill="#FFFFFF" stroke="#121A3F" stroke-width="1.75" />
  <!-- Onitsha Igbo (Lower Niger east bank) -->
  <path id="region-ig-onitsha" d="M304 326L358 322L362 364L306 368L304 326Z" fill="#FFFFFF" stroke="#121A3F" stroke-width="1.75" />
  <!-- Owerri Igbo (Imo heartland) -->
  <path id="region-ig-owerri" d="M316 372L376 368L380 412L318 416L316 372Z" fill="#FFFFFF" stroke="#121A3F" stroke-width="1.75" />
  <!-- Ikwerre (Rivers / Niger Delta north) -->
